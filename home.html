<!-- Typed.js -->
<script
    src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"
></script>


<script>

    /*
     * TYPED TEXT
     */

    new Typed(
        "#typed-text",
        {
            strings: [
                "Network Engineer",
                "Network Enthusiast",
                "IT Infrastructure Student",
                "Network Administration Student"
            ],

            typeSpeed: 60,

            backSpeed: 40,

            backDelay: 1800,

            loop: true
        }
    );


    /*
     * MATRIX
     */

    const canvas =
        document.getElementById(
            "matrix-canvas"
        );

    const ctx =
        canvas.getContext("2d");


    const characters =
        "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";


    let width;
    let height;

    let columns;
    let drops;


    function resizeMatrix() {

        width =
            canvas.width =
            window.innerWidth;

        height =
            canvas.height =
            window.innerHeight;


        const fontSize = 16;


        columns =
            Math.floor(
                width / fontSize
            );


        drops =
            Array(columns).fill(1);

    }


    function drawMatrix() {

        ctx.fillStyle =
            "rgba(0, 0, 0, 0.08)";


        ctx.fillRect(
            0,
            0,
            width,
            height
        );


        ctx.fillStyle =
            "#00ff41";


        ctx.font =
            "16px monospace";


        for (
            let i = 0;
            i < drops.length;
            i++
        ) {

            const character =
                characters[
                    Math.floor(
                        Math.random()
                        * characters.length
                    )
                ];


            ctx.fillText(
                character,
                i * 16,
                drops[i] * 16
            );


            if (
                drops[i] * 16 > height &&
                Math.random() > 0.975
            ) {

                drops[i] = 0;

            }


            drops[i]++;

        }

    }


    resizeMatrix();


    window.addEventListener(
        "resize",
        resizeMatrix
    );


    setInterval(
        drawMatrix,
        50
    );

</script>
