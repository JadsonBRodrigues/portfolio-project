    <!-- =========================
         TYPED.JS
    ========================== -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const typedElement = document.querySelector(".typed");

            if (typedElement) {

                const items = typedElement
                    .getAttribute("data-typed-items")
                    .split(",");

                let itemIndex = 0;
                let charIndex = 0;
                let deleting = false;

                function typeEffect() {

                    const currentText = items[itemIndex];

                    if (!deleting) {

                        typedElement.textContent =
                            currentText.substring(0, charIndex + 1);

                        charIndex++;

                        if (charIndex === currentText.length) {

                            deleting = true;

                            setTimeout(typeEffect, 1800);

                            return;
                        }

                    } else {

                        typedElement.textContent =
                            currentText.substring(0, charIndex - 1);

                        charIndex--;

                        if (charIndex === 0) {

                            deleting = false;

                            itemIndex++;

                            if (itemIndex >= items.length) {
                                itemIndex = 0;
                            }

                        }

                    }

                    setTimeout(
                        typeEffect,
                        deleting ? 50 : 90
                    );
                }

                typeEffect();
            }


            /* =========================
               MOBILE MENU
            ========================== */

            const menuButton =
                document.querySelector(".mobile-nav-toggle");

            const nav =
                document.querySelector(".nav-menu");

            if (menuButton && nav) {

                menuButton.addEventListener("click", function () {

                    document.body.classList.toggle(
                        "mobile-nav-active"
                    );

                    const icon =
                        menuButton.querySelector("i");

                    if (
                        document.body.classList.contains(
                            "mobile-nav-active"
                        )
                    ) {

                        icon.classList.remove("bx-menu");
                        icon.classList.add("bx-x");

                    } else {

                        icon.classList.remove("bx-x");
                        icon.classList.add("bx-menu");

                    }

                });


                /* Fechar menu ao clicar num link */

                nav.querySelectorAll("a").forEach(function (link) {

                    link.addEventListener("click", function () {

                        document.body.classList.remove(
                            "mobile-nav-active"
                        );

                        const icon =
                            menuButton.querySelector("i");

                        icon.classList.remove("bx-x");
                        icon.classList.add("bx-menu");

                    });

                });

            }

        });


        /* =========================
           MATRIX EFFECT
        ========================== */

        const canvas =
            document.getElementById("matrix-canvas");

        const ctx =
            canvas.getContext("2d");

        let width;
        let height;

        let fontSize = 16;

        let columns;
        let drops;


        function resizeMatrix() {

            width = canvas.width =
                window.innerWidth;

            height = canvas.height =
                window.innerHeight;

            columns =
                Math.floor(width / fontSize);

            drops = [];

            for (let i = 0; i < columns; i++) {

                drops[i] =
                    Math.floor(
                        Math.random() *
                        (height / fontSize)
                    );

            }

        }


        resizeMatrix();


        window.addEventListener(
            "resize",
            resizeMatrix
        );


        const matrixCharacters =
            "アァカサタナハマヤャラワガザダバパ" +
            "0123456789" +
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
            "abcdefghijklmnopqrstuvwxyz" +
            "アイウエオカキクケコサシスセソ" +
            "01";


        function drawMatrix() {

            /*
             * Fundo transparente/preto muito subtil.
             * Isto cria o efeito de rasto.
             */

            ctx.fillStyle =
                "rgba(0, 0, 0, 0.06)";

            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            ctx.font =
                fontSize + "px monospace";


            for (let i = 0; i < drops.length; i++) {

                const character =
                    matrixCharacters[
                        Math.floor(
                            Math.random() *
                            matrixCharacters.length
                        )
                    ];


                /*
                 * Verde Matrix
                 */

                ctx.fillStyle =
                    "rgba(0, 255, 70, 0.75)";


                ctx.fillText(
                    character,
                    i * fontSize,
                    drops[i] * fontSize
                );


                /*
                 * Reinicia a coluna
                 */

                if (
                    drops[i] * fontSize >
                        height &&
                    Math.random() > 0.975
                ) {

                    drops[i] = 0;

                }


                drops[i]++;

            }

        }


        /*
         * Velocidade do Matrix
         */

        setInterval(
            drawMatrix,
            50
        );

    </script>

</body>

</html>
