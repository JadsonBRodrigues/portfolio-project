    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>


    <script>

        document.addEventListener(

            function () {

                new Typed(".typed", {

                    strings: [

                        "Network & Systems Student",
                        "Network Enthusiast",
                        "IT Infrastructure Student",

                    backSpeed: 30,

                    backDelay: 1000,

                    startDelay: 1000,

                    loop: true

                });

            }
        );

    </script>


    <!-- =========================
         MATRIX EFFECT
    ========================== -->

    <script>

        const canvas =
            document.getElementById("matrix-canvas");

        const ctx =
            canvas.getContext("2d");


        function resizeCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

        }


        resizeCanvas();


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        const characters =
            "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";


        const fontSize = 14;

        let columns =
            Math.floor(
                canvas.width / fontSize
            );


        let drops =
            Array(columns).fill(1);


        function drawMatrix() {

            ctx.fillStyle =
                "rgba(0, 0, 0, 0.05)";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.fillStyle =
                "#00ff41";

            ctx.font =
                fontSize + "px monospace";


            for (
                let i = 0;
                i < drops.length;
                i++
            ) {

                const character =
                    characters[
                        Math.floor(
                            Math.random() *
                            characters.length
                        )
                    ];


                ctx.fillText(
                    character,
                    i * fontSize,
                    drops[i] * fontSize
                );


                if (
                    drops[i] * fontSize >
                    canvas.height &&
                    Math.random() > 0.975
                ) {

                    drops[i] = 0;

                }


                drops[i]++;

            }

        }


        setInterval(
            drawMatrix,
            40
        );

    </script>


    <!-- =========================
         MOBILE NAVIGATION
    ========================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const toggle =
                    document.querySelector(
                        ".mobile-nav-toggle"
                    );

                const nav =
                    document.querySelector(
                        ".nav-menu"
                    );

                const icon =
                    toggle.querySelector("i");


                toggle.addEventListener(
                    "click",
                    function () {

                        nav.classList.toggle(
                            "mobile-nav-active"
                        );

                        toggle.classList.toggle(
                            "mobile-nav-active"
                        );


                        icon.classList.toggle(
                            "bx-menu"
                        );

                        icon.classList.toggle(
                            "bx-x"
                        );

                    }
                );


                document.addEventListener(
                    "click",
                    function (event) {

                        if (

                            !nav.contains(
                                event.target
                            )

                            &&

                            !toggle.contains(
                                event.target
                            )

                            &&

                            nav.classList.contains(
                                "mobile-nav-active"
                            )

                        ) {

                            nav.classList.remove(
                                "mobile-nav-active"
                            );

                            toggle.classList.remove(
                                "mobile-nav-active"
                            );

                            icon.classList.add(
                                "bx-menu"
                            );

                            icon.classList.remove(
                                "bx-x"
                            );

                        }

                    }
                );

            }
        );

    </script>
